name: Informe semanal de redes (IG + FB + GA4)

# Envia cada lunes a las 08:15 UTC un estudio completo del rendimiento de los
# Reels, Carruseles, Historias y estado de la cola de publicacion de Brami3D.

on:
  schedule:
    - cron: "15 8 * * 1"   # cada lunes 08:15 UTC
  workflow_dispatch:
    inputs:
      n:
        description: "Numero de publicaciones recientes a analizar"
        required: false
        default: "15"

permissions:
  contents: read

env:
  GA_PROPERTY_ID: "531047655"
  EMAIL_DESTINO: "alexri69@gmail.com"
  META_PAGE_ID: "1153412231189064"
  META_IG_USER_ID: "17841442053876570"

jobs:
  informe-redes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install --quiet google-auth requests
      - name: Restaurar credenciales GA4
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GA_SERVICE_ACCOUNT_JSON" ]; then
            mkdir -p secretos
            printf '%s' "$GA_SERVICE_ACCOUNT_JSON" > secretos/ga-service-account.json
          fi
      - name: Generar y enviar estudio semanal de redes
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NUM_POSTS: ${{ github.event.inputs.n || '15' }}
        run: python scripts/informe_redes.py --n "$NUM_POSTS" --email "$EMAIL_DESTINO"
